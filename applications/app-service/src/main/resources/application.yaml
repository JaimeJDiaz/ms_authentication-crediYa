server:
  port: ${MS_AUTHENTICATION_PORT:8081}
spring:
  application:
    name: "ms-authentication"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://db-authentication:5432/crediya_authentication_db}
    username: ${SPRING_R2DBC_USERNAME:crediya_user}
    password: ${SPRING_R2DBC_PASSWORD:StrongPassword123!}
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080,http://localhost:8081"

adapters:
  r2dbc:
    host: ${DB_HOST:localhost}
    port: ${DB_AUTHENTICATION_PORT:5433}
    database: ${DB_AUTHENTICATION_NAME:ms_authentication_db}
    schema: ${DB_SCHEMA:public}
    username: ${POSTGRES_USER:crediya_user}
    password: ${POSTGRES_PASSWORD:StrongPassword123!}
